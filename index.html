<body>
    <canvas id="game"></canvas>
    <script>
        /////////////
        ////CANVAS///
        /////////////
        const canvas = document.getElementById("game"); /*the game canvas that we will draw on*/
        const ctx = canvas.getContext("2d"); /*le pinceau du jeu, il permet de "dessiner"/de faire les visuels du jeu*/

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.fillStyle = "#0b1410";
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        /////////////
        ////STARS////
        /////////////
        const star = { x: 800, y: 45, size: 3 }; /*Background's stars infos*/
        const starNum = 200; /*Number of stars displayed on the background*/
        const stars = []; /*stars array*/

        function createStars() {
            for (const star of stars) {
                star.push;
                ctx.fillStyle = "white";
                ctx.fillRect(Math.random(0, star.x), Math.random(0, star.y), star.size, star.size);
            }
        }

        /////////////////////
        ////START & UPDATE///
        /////////////////////
        gameStart();
        gameUpdate();

        function gameStart() {
            createStars();
        }

        function gameUpdate() {

        }
        
    </script>
</body>
