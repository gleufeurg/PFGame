<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evangeline's Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { /*pré-réglages du body, là où se trouve le canvas du jeu*/
            margin: 0; /* pas de marge automatique*/
            overflow: hidden; /*enlève les barres de défilement*/
            background-color: #00033e;
            color: white;
            outline: 1px, solid gold;
            font-family: "Rubik", sans-serif; /*"Rubik" possible car certains noms contiennent des espaces, ici pas nécessaire mais juste au cas ou*/
            text-align: center;
            font-size: 30px;
        }

        #game {
            /*outline: 1px solid antiquewhite;
            outline-offset: -1px;*/
        }
    </style>
    <script>

    </script>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        /////////////////////
        ////MISCS SETTINGS///  All the variables you can manually change to modify the game
        /////////////////////


        /////////////
        ////CANVAS///
        /////////////
        const canvas = document.getElementById("game"); /*the game canvas that we will draw on*/
        const ctx = canvas.getContext("2d"); /*le pinceau du jeu, il permet de "dessiner"/de faire les visuels du jeu*/
        const bgColor = "#000017";

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        //////////////////////
        ////STARS & GALAXY////  Background stars
        //////////////////////
        const stars = []; /*stars array*/
        const STAR_COORDINATES = { x: canvas.width, y: canvas.height }; /*Stars display boundaries, can also just put a flat number*/
        const STAR_MAX_SIZE = 4;
        const STAR_COUNT = 200; /*The amount of stars displayed*/

        const GALAXY_THICKNESS = 300;
        const galaxyTop = canvas.height / 2 - GALAXY_THICKNESS / 2;
        const galaxyGradient = ctx.createLinearGradient(0, canvas.height, canvas.width, 0);

        function createStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * STAR_COORDINATES.x,
                    y: Math.random() * STAR_COORDINATES.y,
                    size: Math.random() * STAR_MAX_SIZE
                });
            }

            drawStars();
        }

        function drawGalaxy() {
            galaxyGradient.addColorStop(0, "rgba(0, 0, 0, 0)")
            galaxyGradient.addColorStop(0.5, "rgba(85, 0, 255, 0.3)")
            galaxyGradient.addColorStop(1, "rgba(0, 0, 0, 0)")

            ctx.fillStyle = galaxyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height)
        }

        function drawStars() {
            for (const star of stars) {
                ctx.fillStyle = "white";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
        }

        ///////////////////////
        ////PLAYER & PLANETS///
        ///////////////////////

        function drawCentrePlanet() {
            //PARAMETERS
            ctx.fillStyle = "#ffe680";
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const count = 50;
            const branches = 10;
            const innerRadius = 50;
            const outerRadius = 100;

            //TRIANGLE
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, canvas.height / 2 + 150);
            ctx.lineTo(canvas.width / 2 + 150, canvas.height / 2 - 150);
            ctx.lineTo(canvas.width / 2 - 150, canvas.height / 2 - 150);
            ctx.closePath();
            ctx.fill();


            //CIRCLE
            ctx.beginPath();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const count = 50;

            for (let i = 0; i < count; i++) {
                const angle = Math.PI * 2 / count * i;

                const x = centerX + Math.cos(angle) * outerRadius;
                const y = centerY + Math.sin(angle) * outerRadius;
                ctx.lineTo(x, y);
                ctx.fill();
            }

            //DOUBLE CIRCLE
            beginPath();
            for (let i = 0; i < count; i++) {
                const angle = Math.PI * 2 / count * i;

                const x = centerX + Math.cos(angle) * outerRadius;
                const y = centerY + Math.sin(angle) * outerRadius;

                ctx.lineTo(x, y);
                ctx.fill();
            }

            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const angle = Math.PI * 2 / count * i;

                const x = centerX + Math.cos(angle) * innerRadius;
                const y = centerY + Math.sin(angle) * innerRadius;
                ctx.lineTo(x, y);
                ctx.fillStyle = "#111111";
                ctx.fill();
            }

            //STAR
            ctx.beginPath();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < branches; i++) {
                const angle = Math.PI * 2 / branches * i;

                if (i % 2 === 0) {
                    const x = centerX + Math.cos(angle) * innerRadius;
                    const y = centerY + Math.sin(angle) * innerRadius;
                    ctx.lineTo(x,y);
                } else {
                    const x = centerX + Math.cos(angle) * outerRadius;
                    const y = centerY + Math.sin(angle) * outerRadius;
                    ctx.lineTo(x,y);
                }

            }
            ctx.fill();
        }

        /////////////////////
        ////START & UPDATE///
        /////////////////////
        gameStart();
        gameUpdate();

        function gameStart() {
            createStars();
            drawGalaxy();
            drawCentrePlanet();
        }

        function gameUpdate() {

        }

    </script>
</body>
</html>
