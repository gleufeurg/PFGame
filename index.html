<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evangeline's Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { /*pré-réglages du body, là où se trouve le canvas du jeu*/
            margin: 0; /* pas de marge automatique*/
            overflow: hidden; /*enlève les barres de défilement*/
            background-color: #00033e;
            color: white;
            font-family: "Rubik", sans-serif; /*"Rubik" possible car certains noms contiennent des espaces, ici pas nécessaire mais juste au cas ou*/
            text-align: center;
            font-size: 30px;
        }

        button {
            font-family: inherit; /*les boutons n'héritent pas de la police par défaut*/
        }

        #hud { /*affichage de l'or et de l'XP, par-dessus le canvas*/
            position: fixed; /*reste collé à l'écran, au-dessus du canvas*/
            top: 16px;
            left: 16px;
            font-size: 20px;
            text-align: left;
            pointer-events: none; /*les clics passent à travers, vers le canvas*/
        }

        #gold {
            color: #ffd84d;
        }

        #xp {
            color: #7df9ff;
        }

        #hint { /*petite aide en bas de l'écran*/
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            font-size: 14px;
            color: #ffffff88;
            pointer-events: none;
        }

        /*////////////////////
          ////PANNEAUX (menus)
          ////////////////////*/
        .hidden {
            display: none !important; /*cache un élément ; on ajoute/enlève cette classe en JS*/
        }

        .overlay { /*fond sombre qui recouvre tout l'écran*/
            position: fixed;
            inset: 0; /*= top: 0; right: 0; bottom: 0; left: 0;*/
            background-color: rgba(0, 0, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            text-align: left;
        }

        .panel { /*la "fenêtre" au milieu de l'overlay*/
            background-color: #0b0b2e;
            border: 1px solid white;
            border-radius: 12px;
            padding: 24px;
            width: calc(100% - 32px);
            max-width: 1100px;
            max-height: calc(100% - 32px);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .panel h1, .panel h2 {
            margin-top: 0;
        }

        .placeholder { /*les espaces que tu rempliras plus tard*/
            border: 1px dashed #ffffff66;
            border-radius: 8px;
            padding: 16px;
            color: #aaaacc;
        }

        .primaryButton {
            background-color: white;
            color: #000017;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /*SKILL TREE*/
        #skillTreePanel .panel {
            display: flex;
            gap: 24px;
        }

        #projectArea { /*à gauche : la présentation du projet*/
            flex: 0 0 34%;
            border-right: 1px solid #ffffff33;
            padding-right: 24px;
        }

        #projectContent {
            min-height: 240px;
        }

        #treeArea { /*à droite : l'arbre*/
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .treeHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .treeHeader h2 {
            margin: 0;
            color: var(--tree-color);
        }

        #treeXp {
            color: #7df9ff;
        }

        #treeCanvas { /*zone où sont placées les compétences*/
            position: relative;
            height: 420px;
            margin: 16px 0;
        }

        #treeLinks, #treeNodes {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #treeLinks line {
            stroke: #ffffff33;
            stroke-width: 3;
        }

        #treeLinks line.active {
            stroke: var(--tree-color);
        }

        .skillNode { /*une compétence = un bouton rond*/
            position: absolute;
            transform: translate(-50%, -50%); /*centre le bouton sur sa position*/
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #555577;
            background-color: #151538;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 0;
            cursor: pointer;
        }

        .skillNode.keystone { /*compétence majeure, au bout d'une branche*/
            width: 64px;
            height: 64px;
            font-size: 13px;
        }

        .skillNode.available {
            border-color: var(--tree-color);
        }

        .skillNode.unlocked {
            background-color: var(--tree-color);
            border-color: white;
            color: #000017;
        }

        .skillNode.locked {
            opacity: 0.4;
        }

        #nodeInfo {
            min-height: 48px;
            margin: 0;
        }

        /*GAME OVER + SHOP*/
        #gameOverPanel .panel {
            max-width: 760px;
            text-align: center;
        }

        #shopGold {
            color: #ffd84d;
        }

        #shopItems {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /*autant de colonnes que possible, 200px min*/
            gap: 12px;
            margin: 16px 0;
        }

        .shopItem {
            border: 1px solid #ffffff44;
            border-radius: 8px;
            padding: 12px;
            background-color: #151538;
            color: white;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
        }

        .shopItem:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .shopItem .cost {
            color: #ffd84d;
        }

        #contactArea {
            margin-top: 24px;
            text-align: left;
        }

        @media (max-width: 700px) { /*petits écrans : le projet passe au-dessus de l'arbre*/
            #skillTreePanel .panel {
                flex-direction: column;
            }

            #projectArea {
                border-right: none;
                padding-right: 0;
            }
        }
    </style>
</head>
<body>
    <div id="hud">Or : <span id="gold">0</span><br>XP : <span id="xp">0</span></div>
    <div id="hint">Clique sur une planète pour ouvrir son arbre de compétences</div>
    <canvas id="game"></canvas>

    <!-- SKILL TREE : s'ouvre quand on clique sur une planète -->
    <div id="skillTreePanel" class="overlay hidden">
        <div class="panel">
            <section id="projectArea">
                <h2 id="projectTitle"></h2>
                <div id="projectContent" class="placeholder"></div>
            </section>
            <section id="treeArea">
                <div class="treeHeader">
                    <h2 id="treeTitle"></h2>
                    <span>XP disponible : <span id="treeXp">0</span></span>
                    <button id="closeTreeButton" class="primaryButton">Reprendre ▶</button>
                </div>
                <div id="treeCanvas">
                    <svg id="treeLinks"></svg>
                    <div id="treeNodes"></div>
                </div>
                <p id="nodeInfo"></p>
            </section>
        </div>
    </div>

    <!-- GAME OVER : le shop + les contacts -->
    <div id="gameOverPanel" class="overlay hidden">
        <div class="panel">
            <h1>GAME OVER</h1>
            <p>Or disponible : <span id="shopGold">0</span></p>
            <div id="shopItems"></div>
            <button id="restartButton" class="primaryButton">Rejouer (R)</button>
            <section id="contactArea">
                <h2>Contact</h2>
                <div class="placeholder">
                    <!-- À REMPLIR : tes coordonnées -->
                    Mail : ton.mail@exemple.com<br>
                    Téléphone : 06 00 00 00 00<br>
                    LinkedIn / Portfolio : ...
                </div>
            </section>
        </div>
    </div>

    <script>
        /////////////
        ////CANVAS///
        /////////////
        const canvas = document.getElementById("game"); /*the game canvas that we will draw on*/
        const ctx = canvas.getContext("2d"); /*le pinceau du jeu, il permet de "dessiner"/de faire les visuels du jeu*/
        const bgColor = "#000017";
        const OUTLINE_WIDTH = 1;        // contour fin des planètes et des ennemis, en pixels
        const OUTLINE_COLOR = "white";

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const center = { x: canvas.width / 2, y: canvas.height / 2 };


        function drawCanvas() {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGalaxy();
            drawStars();
            drawPlanets();
            drawEnemies();
            drawBullets();
            drawPlayer();
        }


        //////////////////////
        ////BACKGROUND////////  Background stars and galaxy effect
        //////////////////////
        const stars = []; /*stars array*/
        const STAR_COORDINATES = { x: canvas.width, y: canvas.height }; /*Stars display boundaries, can also just put a flat number*/
        const STAR_MAX_SIZE = 4;
        const STAR_COUNT = 200; /*The amount of stars displayed*/

        function createStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * STAR_COORDINATES.x,
                    y: Math.random() * STAR_COORDINATES.y,
                    size: Math.random() * STAR_MAX_SIZE
                });
            }
        }

        function drawGalaxy() {
            const galaxyGradient = ctx.createLinearGradient(0, 0, canvas.height, canvas.width);
            galaxyGradient.addColorStop(0, "rgba(0, 0, 0, 0)")
            galaxyGradient.addColorStop(0.5, "rgba(85, 0, 255, 0.3)")
            galaxyGradient.addColorStop(1, "rgba(0, 0, 0, 0)")

            ctx.fillStyle = galaxyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height)
        }

        function drawStars() {
            for (const star of stars) {
                ctx.fillStyle = "white";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
        }


        /////////////////////
        ////PLAYER STATS/////  Toutes les valeurs que le shop et les skill trees peuvent améliorer
        /////////////////////
        const BASE_STATS = {
            maxHealth: 100,       // points de vie max
            regen: 0,             // PV regagnés par seconde
            damageReduction: 0,   // dégâts en moins à chaque coup reçu
            lifeOnKill: 0,        // PV regagnés à chaque ennemi tué
            damage: 1,            // dégâts par balle
            attackSpeed: 1,       // multiplicateur de cadence de tir (1 = normal, 1.5 = 50% plus rapide)
            range: 300,           // distance max pour viser, en pixels
            bulletSpeed: 1,       // multiplicateur de vitesse des balles
            bulletCount: 1,       // nombre de balles par tir
            goldMultiplier: 1,    // multiplicateur d'or gagné
            xpMultiplier: 1       // multiplicateur d'XP gagnée
        };
        let playerStats = {};

        //Recalcule les stats à partir de zéro : base + niveaux du shop + compétences débloquées
        function computeStats() {
            playerStats = { ...BASE_STATS }; //copie de BASE_STATS (sans la modifier)
            playerStats.damageVs = { water: 0, fire: 0, plant: 0, air: 0 }; //dégâts bonus contre chaque élément

            for (const item of SHOP_ITEMS) {
                applyEffect(item.effect, item.level);
            }

            for (const tree of SKILL_TREES) {
                for (const node of tree.nodes) {
                    if (node.unlocked) {
                        applyEffect(node.effect, 1);
                    }
                }
            }
        }

        function applyEffect(effect, times) {
            if (effect.stat === "damageVs") {
                playerStats.damageVs[effect.element] += effect.value * times;
            } else {
                playerStats[effect.stat] += effect.value * times;
            }
        }

        //À appeler après chaque achat : si la vie max augmente, on gagne aussi ces PV
        function refreshStats() {
            const oldMaxHealth = playerStats.maxHealth;
            computeStats();
            if (playerStats.maxHealth > oldMaxHealth) {
                playerHealth += playerStats.maxHealth - oldMaxHealth;
            }
        }


        ///////////////////////
        ////PLAYER & PLANETS///
        ///////////////////////
        const PLAYER_ROTATION_SPEED = 2;
        let playerRotation = 0;
        let planetOrbitalRotation = 0;
        const PLANETS_ORBITAL_ROTATION_SPEED = .25;
        const planets = [];

        function drawStarShape(color = "#ffe680", branches = 10, innerRadius = 10, outerRadius = 25, rotationSpeed = .5, rotationalDirection = - 1) {
            //STAR
            ctx.beginPath();
            for (let i = 0; i < branches; i++) {
                const angle = (playerRotation * rotationSpeed * rotationalDirection) + (Math.PI * 2 / branches * i);

                if (i % 2 === 0) {
                    const x = center.x + Math.cos(angle) * innerRadius;
                    const y = center.y + Math.sin(angle) * innerRadius;
                    ctx.lineTo(x, y);
                } else {
                    const x = center.x + Math.cos(angle) * outerRadius;
                    const y = center.y + Math.sin(angle) * outerRadius;
                    ctx.lineTo(x, y);
                }
            }
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawCircle(color = "#ffe680", radius = 20, count = 50, rotationSpeed = .25, rotationalDirection = - 1, outline = false, outlineWidth = 0, outlineColor = "#ffffff", location = center) {
            //PARAMETERS
            const centerX = location.x;
            const centerY = location.y;

            if (outline) {
                drawCircle(outlineColor, outlineWidth, count, rotationSpeed, rotationalDirection, false, 0, outlineColor, location);
            }

            //CIRCLE
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const angle = (playerRotation * rotationSpeed * rotationalDirection - Math.PI / 2) + (Math.PI * 2 / count * i);

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                ctx.lineTo(x, y);
            }
            ctx.fillStyle = color;
            ctx.fill();
        }

        //PLAYER HEALTH
        const PLAYER_RADIUS = 32;
        const PLAYER_HIT_FLASH_DURATION = 0.15;   // secondes
        let playerHealth = 0;                     // mis à la vie max au démarrage
        let playerHitTimer = 0;
        let isGameOver = false;
        let isPaused = false;                     // true quand un skill tree est ouvert

        function damagePlayer(amount) {
            playerHealth -= Math.max(1, amount - playerStats.damageReduction); //on prend toujours au moins 1 dégât
            playerHitTimer = PLAYER_HIT_FLASH_DURATION;

            if (playerHealth <= 0) {
                playerHealth = 0;
                isGameOver = true;
                openGameOver();
            }
        }

        function healPlayer(amount) {
            playerHealth = Math.min(playerStats.maxHealth, playerHealth + amount); //jamais au-dessus de la vie max
        }

        function drawPlayer() {
            const color = playerHitTimer > 0 ? "white" : "#ffe680";
            //Pour un triangle, le contour doit être 2x plus grand pour avoir la même épaisseur sur les côtés que les cercles
            drawCircle(color, PLAYER_RADIUS, 4, .1, -1, true, PLAYER_RADIUS + OUTLINE_WIDTH * 2, OUTLINE_COLOR); //Centered shape is the player
            drawPlayerHealth();
        }

        //HEALTH NUMBER (au centre du joueur)
        function drawPlayerHealth() {
            const healthText = Math.ceil(playerHealth); //arrondi au-dessus : la régénération donne des nombres à virgule
            ctx.font = "bold 20px Rubik";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle"; //le y du texte = le milieu des lettres, pas le bas
            ctx.lineWidth = 3;
            ctx.strokeStyle = OUTLINE_COLOR;
            ctx.strokeText(healthText, center.x, center.y); //contour du texte, pour qu'il reste lisible
            ctx.fillStyle = "brown";
            ctx.fillText(healthText, center.x, center.y);
            ctx.textBaseline = "alphabetic"; //on remet la valeur par défaut pour les autres textes
        }

        //REWARDS (or et XP)
        let gold = 0;
        let xp = 0;
        const goldDisplay = document.getElementById("gold");
        const xpDisplay = document.getElementById("xp");

        function gainRewards(goldAmount, xpAmount) {
            gold += Math.round(goldAmount * playerStats.goldMultiplier);
            xp += Math.round(xpAmount * playerStats.xpMultiplier);
            updateHud();
        }

        function updateHud() {
            goldDisplay.textContent = gold;
            xpDisplay.textContent = xp;
        }

        // RÉGLAGES DES PLANÈTES
        const PLANET_ORBIT_RADIUS = 100;
        const PLANET_SIZE = 20;
        const PLANET_CLICK_MARGIN = 8;            // pixels en plus autour de la planète pour cliquer plus facilement

        // CRÉATION (une seule fois, au démarrage) : une planète par skill tree
        function createPlanets() {
            for (const tree of SKILL_TREES) {
                planets.push({
                    //Mettre ici toutes les infos qui seront nécessaires pour les planètes, (skillTree, projets, liens...)
                    name: tree.name,
                    color: tree.color,
                    size: PLANET_SIZE,
                    tree: tree,
                    x: 0,
                    y: 0
                });
            }
        }

        function drawPlanets() {
            for (let i = 0; i < planets.length; i++) {
                const planet = planets[i];
                const angle = planetOrbitalRotation + Math.PI * 2 / planets.length * i;

                planet.x = center.x + Math.cos(angle) * PLANET_ORBIT_RADIUS;
                planet.y = center.y + Math.sin(angle) * PLANET_ORBIT_RADIUS;

                drawCircle(planet.color, planet.size, 4, 0, 0, true, planet.size + OUTLINE_WIDTH, OUTLINE_COLOR, { x: planet.x, y: planet.y });
            }
        }

        //Renvoie la planète sous la souris, ou null
        function findPlanetAt(x, y) {
            for (const planet of planets) {
                if (Math.hypot(planet.x - x, planet.y - y) <= planet.size + PLANET_CLICK_MARGIN) {
                    return planet;
                }
            }
            return null;
        }

        canvas.addEventListener("click", function (event) {
            if (isGameOver || isPaused) {
                return;
            }
            const planet = findPlanetAt(event.offsetX, event.offsetY);
            if (planet !== null) {
                openSkillTree(planet.tree);
            }
        });

        //Le curseur devient une main quand on survole une planète
        canvas.addEventListener("mousemove", function (event) {
            const planet = findPlanetAt(event.offsetX, event.offsetY);
            canvas.style.cursor = planet !== null ? "pointer" : "default";
        });


        /////////////
        ///ENEMIES///
        /////////////
        const enemies = [];
        const ENEMY_SPAWN_INTERVAL = 1;      // un ennemi toutes les X secondes
        let enemySpawnTimer = 0;

        //TYPES (éléments)
        const ENEMY_TYPES = {
            water: { color: "#4da6ff", speed: 50, minSize: 9, maxSize: 15, damage: 10, health: 3, gold: 2, xp: 3 },
            fire: { color: "#ff5533", speed: 90, minSize: 6, maxSize: 11, damage: 20, health: 2, gold: 3, xp: 4 },
            plant: { color: "#55dd55", speed: 35, minSize: 11, maxSize: 20, damage: 15, health: 5, gold: 4, xp: 6 },
            air: { color: "#e0f7ff", speed: 70, minSize: 5, maxSize: 9, damage: 5, health: 1, gold: 1, xp: 2 }
        };

        //MOVEMENTS
        const MOVEMENT_TYPES = ["straight", "wave", "zigzag", "spiral"];
        const ENEMY_WAVE_AMPLITUDE = 40;     // écart max sur le côté, en pixels
        const ENEMY_WAVE_FREQUENCY = 3;      // vitesse des oscillations
        const ENEMY_SPIRAL_SPEED = 0.4;      // vitesse de rotation autour du joueur

        function pickRandom(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function spawnEnemy() {
            const type = pickRandom(Object.keys(ENEMY_TYPES));
            const stats = ENEMY_TYPES[type];
            const size = randomBetween(stats.minSize, stats.maxSize);
            const startDistance = Math.hypot(canvas.width, canvas.height) / 2 + size + ENEMY_WAVE_AMPLITUDE;

            enemies.push({
                type: type,
                movement: pickRandom(MOVEMENT_TYPES),
                color: stats.color,
                speed: stats.speed,
                size: size,
                damage: stats.damage,
                health: stats.health,
                gold: stats.gold,
                xp: stats.xp,
                angle: Math.random() * Math.PI * 2,
                distance: startDistance,
                startDistance: startDistance,
                time: 0,
                x: 0,
                y: 0
            });
        }

        function updateEnemies(deltaTime) {
            //SPAWN
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer >= ENEMY_SPAWN_INTERVAL) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            //MOVE
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                enemy.time += deltaTime;
                enemy.distance -= enemy.speed * deltaTime;

                if (enemy.distance <= PLAYER_RADIUS + enemy.size) {
                    enemies.splice(i, 1);
                    damagePlayer(enemy.damage);
                    if (isGameOver) {
                        return; //la partie est finie, on arrête de bouger les ennemis
                    }
                    continue;
                }

                let sideOffset = 0;

                if (enemy.movement === "wave") {
                    sideOffset = Math.sin(enemy.time * ENEMY_WAVE_FREQUENCY) * ENEMY_WAVE_AMPLITUDE;
                } else if (enemy.movement === "zigzag") {
                    sideOffset = Math.asin(Math.sin(enemy.time * ENEMY_WAVE_FREQUENCY)) / (Math.PI / 2) * ENEMY_WAVE_AMPLITUDE;
                } else if (enemy.movement === "spiral") {
                    enemy.angle += ENEMY_SPIRAL_SPEED * deltaTime;
                }

                sideOffset *= enemy.distance / enemy.startDistance;

                const dirX = Math.cos(enemy.angle);
                const dirY = Math.sin(enemy.angle);

                enemy.x = center.x + dirX * enemy.distance - dirY * sideOffset;
                enemy.y = center.y + dirY * enemy.distance + dirX * sideOffset;
            }
        }

        function drawEnemies() {
            for (const enemy of enemies) {
                drawCircle(enemy.color, enemy.size, 30, 0, 0, true, enemy.size + OUTLINE_WIDTH, OUTLINE_COLOR, { x: enemy.x, y: enemy.y });
            }
        }


        /////////////
        ///BULLETS///
        /////////////
        const bullets = [];
        const BASE_FIRE_INTERVAL = 0.35;     // un tir toutes les X secondes (divisé par playerStats.attackSpeed)
        const BASE_BULLET_SPEED = 400;       // pixels par seconde (multiplié par playerStats.bulletSpeed)
        const BULLET_SIZE = 4;
        const BULLET_COLOR = "#fff6b0";
        let fireTimer = 0;

        //Renvoie les ennemis à portée, du plus proche au plus loin
        function findEnemiesInRange() {
            const inRange = [];
            for (const enemy of enemies) {
                const distance = Math.hypot(enemy.x - center.x, enemy.y - center.y);
                if (distance < playerStats.range) {
                    inRange.push({ enemy: enemy, distance: distance });
                }
            }
            inRange.sort(function (a, b) { return a.distance - b.distance; }); //trie du plus petit au plus grand
            return inRange;
        }

        function shootAt(target) {
            bullets.push({
                x: center.x,
                y: center.y,
                dirX: 0,
                dirY: 0,
                target: target
            });
        }

        function hitEnemy(enemy, index) {
            enemy.health -= playerStats.damage + playerStats.damageVs[enemy.type];

            if (enemy.health <= 0) {
                enemies.splice(index, 1);
                gainRewards(enemy.gold, enemy.xp);
                healPlayer(playerStats.lifeOnKill);
            }
        }

        function updateBullets(deltaTime) {
            //FIRE : une balle par ennemi le plus proche (s'il y a moins d'ennemis que de balles, on recommence au plus proche)
            fireTimer += deltaTime;
            if (fireTimer >= BASE_FIRE_INTERVAL / playerStats.attackSpeed) {
                const targets = findEnemiesInRange();
                if (targets.length > 0) {
                    for (let i = 0; i < playerStats.bulletCount; i++) {
                        shootAt(targets[i % targets.length].enemy);
                    }
                    fireTimer = 0;
                }
            }

            //MOVE & HIT
            const maxDistance = Math.hypot(canvas.width, canvas.height) / 2;
            const bulletSpeed = BASE_BULLET_SPEED * playerStats.bulletSpeed;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];

                //La balle suit sa cible tant qu'elle est vivante, sinon elle continue tout droit
                if (enemies.includes(bullet.target)) {
                    const dx = bullet.target.x - bullet.x;
                    const dy = bullet.target.y - bullet.y;
                    const distance = Math.hypot(dx, dy);
                    if (distance > 0) {
                        bullet.dirX = dx / distance;
                        bullet.dirY = dy / distance;
                    }
                }

                bullet.x += bullet.dirX * bulletSpeed * deltaTime;
                bullet.y += bullet.dirY * bulletSpeed * deltaTime;

                let hasHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) <= enemy.size + BULLET_SIZE) {
                        hitEnemy(enemy, j);
                        hasHit = true;
                        break;
                    }
                }

                const isOffScreen = Math.hypot(bullet.x - center.x, bullet.y - center.y) > maxDistance;

                if (hasHit || isOffScreen) {
                    bullets.splice(i, 1);
                }
            }
        }

        function drawBullets() {
            for (const bullet of bullets) {
                drawCircle(BULLET_COLOR, BULLET_SIZE, 12, 0, 0, true, BULLET_SIZE + OUTLINE_WIDTH, OUTLINE_COLOR, { x: bullet.x, y: bullet.y });
            }

        //Assemble la forme (TREE_LAYOUT) et le contenu (skills) de chaque arbre
        function createSkillTree(treeData) {
            const nodes = [];
            for (const id of Object.keys(TREE_LAYOUT)) {
                const layout = TREE_LAYOUT[id];
                const skill = treeData.skills[id];
                nodes.push({
                    id: id,
                    x: layout.x,
                    y: layout.y,
                    cost: layout.cost,
                    requires: layout.requires,
                    isKeystone: layout.keystone === true,
                    label: skill.label,
                    name: skill.name,
                    description: skill.description,
                    effect: skill.effect,
                    unlocked: false
                });
            }
            return { name: treeData.name, color: treeData.color, project: treeData.project, nodes: nodes };
        }

        const SKILL_TREES = [];
        for (const treeData of SKILL_TREES_DATA) {
            SKILL_TREES.push(createSkillTree(treeData));
        }

        function findNode(tree, id) {
            for (const node of tree.nodes) {
                if (node.id === id) {
                    return node;
                }
            }
            return null;
        }

        // "unlocked" = déjà pris, "available" = on peut le prendre, "locked" = pas encore relié
        function getNodeState(tree, node) {
            if (node.unlocked) {
                return "unlocked";
            }
            if (node.requires.length === 0) {
                return "available";
            }
            for (const requiredId of node.requires) {
                if (findNode(tree, requiredId).unlocked) {
                    return "available";
                }
            }
            return "locked";
        }

        //SKILL TREE : AFFICHAGE (HTML)
        const skillTreePanel = document.getElementById("skillTreePanel");

        const treeLinks = document.getElementById("treeLinks");
        const treeNodes = document.getElementById("treeNodes");
        const nodeInfo = document.getElementById("nodeInfo");
        let currentTree = null;

        function openSkillTree(tree) {
            isPaused = true;
            currentTree = tree;
            skillTreePanel.style.setProperty("--tree-color", tree.color); //variable CSS utilisée par les couleurs de l'arbre
            projectTitle.textContent = tree.project.title;
            projectContent.innerHTML = tree.project.html;
            treeTitle.textContent = tree.name;
            nodeInfo.textContent = "Survole une compétence pour voir ce qu'elle fait, clique pour la débloquer avec ton XP.";

            skillTreePanel.classList.remove("hidden");
        }

        function closeSkillTree() {
            skillTreePanel.classList.add("hidden");
            currentTree = null;
            isPaused = false;
        }

        function renderSkillTree() {
            const tree = currentTree;
            treeXp.textContent = xp;
            treeLinks.innerHTML = "";
            treeNodes.innerHTML = "";

            //LIENS entre les compétences (lignes SVG)
            for (const node of tree.nodes) {
                for (const requiredId of node.requires) {
                    const parent = findNode(tree, requiredId);
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", parent.x + "%");
                    line.setAttribute("y1", parent.y + "%");
                    line.setAttribute("x2", node.x + "%");
                    line.setAttribute("y2", node.y + "%");
                    if (parent.unlocked && node.unlocked) {
                        line.classList.add("active");
                    }
                    treeLinks.appendChild(line);
                }
            }

            //COMPÉTENCES (boutons)
            for (const node of tree.nodes) {
                const button = document.createElement("button");
                button.className = "skillNode " + getNodeState(tree, node);
                if (node.isKeystone) {
                    button.classList.add("keystone");
                }
                button.textContent = node.label;
                button.style.left = node.x + "%";
                button.style.top = node.y + "%";
                button.addEventListener("mouseenter", function () { showNodeInfo(node); });
                button.addEventListener("click", function () { unlockNode(node); });
                treeNodes.appendChild(button);
            }
        }

        function showNodeInfo(node) {
            const state = getNodeState(currentTree, node);
            let status = "";
            if (state === "unlocked") {
                status = "✔ Débloquée";
            } else if (state === "locked") {
                status = "🔒 Débloque d'abord une compétence reliée";
            } else if (xp < node.cost) {
                status = "Pas assez d'XP";
            } else {
                status = "Clique pour débloquer";
            }
            nodeInfo.textContent = node.name + " : " + node.description + " | Coût : " + node.cost + " XP | " + status;
        }

        function unlockNode(node) {
            if (getNodeState(currentTree, node) !== "available" || xp < node.cost) {
                showNodeInfo(node);
                return;
            }
            xp -= node.cost;
            node.unlocked = true;
            refreshStats();
            updateHud();
            renderSkillTree();
            showNodeInfo(node);
        }

            { name: "Dégâts", description: "+1 dégât par balle", baseCost: 15, costGrowth: 1.6, maxLevel: 10, level: 0, effect: { stat: "damage", value: 1 } },
            { name: "Régénération", description: "+0.5 PV par seconde", baseCost: 12, costGrowth: 1.6, maxLevel: 8, level: 0, effect: { stat: "regen", value: 0.5 } },
            { name: "Vitesse des balles", description: "+15% de vitesse des balles", baseCost: 8, costGrowth: 1.4, maxLevel: 6, level: 0, effect: { stat: "bulletSpeed", value: 0.15 } }
        ];

        const gameOverPanel = document.getElementById("gameOverPanel");
        const shopGold = document.getElementById("shopGold");
        const shopItems = document.getElementById("shopItems");

        function getShopItemCost(item) {
            return Math.round(item.baseCost * Math.pow(item.costGrowth, item.level)); //Math.pow(a, b) = a puissance b
        }

        function openGameOver() {
            renderShop();
            gameOverPanel.classList.remove("hidden");
        }

        function renderShop() {
            shopGold.textContent = gold;
            shopItems.innerHTML = "";

            for (const item of SHOP_ITEMS) {
                const cost = getShopItemCost(item);
                const isMaxed = item.level >= item.maxLevel;

                const button = document.createElement("button");
                button.className = "shopItem";
                button.disabled = isMaxed || gold < cost;
                button.innerHTML =
                    "<strong>" + item.name + "</strong> (niv. " + item.level + "/" + item.maxLevel + ")<br>" +
                    item.description + "<br>" +
                    "<span class='cost'>" + (isMaxed ? "MAX" : cost + " or") + "</span>";
                button.addEventListener("click", function () { buyShopItem(item); });
                shopItems.appendChild(button);
            }
        }

        function buyShopItem(item) {
            const cost = getShopItemCost(item);
            if (item.level >= item.maxLevel || gold < cost) {
                return;
            }
            gold -= cost;
            item.level++;
            refreshStats();
            updateHud();
            renderShop();
        }

        function restartGame() {
            computeStats();
            playerHealth = playerStats.maxHealth;
            enemies.length = 0;
            bullets.length = 0;
            enemySpawnTimer = 0;
            fireTimer = 0;
            isGameOver = false;
            gameOverPanel.classList.add("hidden");
        }

        document.getElementById("restartButton").addEventListener("click", restartGame);

        document.addEventListener("keydown", function (event) {
            if (event.key === "r" && isGameOver) {
                restartGame();
            }
            if (event.key === "Escape" && isPaused) {
                closeSkillTree();
            }
        });


        /////////////////////
        ////START & UPDATE///
        /////////////////////
        let lastTime = performance.now();

        function gameStart() {
            computeStats();
            playerHealth = playerStats.maxHealth;
            createStars();
            createPlanets();
            requestAnimationFrame(gameUpdate);
        }

        function gameUpdate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000; //DeltaTime en secondes
            lastTime = currentTime;

            //Pendant la pause (skill tree ouvert) ou le game over, plus rien ne bouge
            if (!isGameOver && !isPaused) {
                playerRotation += PLAYER_ROTATION_SPEED * deltaTime;
                planetOrbitalRotation += PLANETS_ORBITAL_ROTATION_SPEED * deltaTime;

                updateEnemies(deltaTime);
                updateBullets(deltaTime);
                healPlayer(playerStats.regen * deltaTime);
                playerHitTimer -= deltaTime;
            }

            drawCanvas();
            requestAnimationFrame(gameUpdate);
        }

        gameStart();
