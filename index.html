<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evangeline's Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { /*pré-réglages du body, là où se trouve le canvas du jeu*/
            margin: 0; /* pas de marge automatique*/
            overflow: hidden; /*enlève les barres de défilement*/
            background-color: #00033e;
            color: white;
            outline: 1px, solid gold;
            font-family: "Rubik", sans-serif; /*"Rubik" possible car certains noms contiennent des espaces, ici pas nécessaire mais juste au cas ou*/
            text-align: center;
            font-size: 30px;
        }

        #hud { /*affichage de l'or et de l'XP, par-dessus le canvas*/
            position: fixed; /*reste collé à l'écran, au-dessus du canvas*/
            top: 16px;
            left: 16px;
            font-size: 20px;
            text-align: left;
            pointer-events: none; /*les clics passent à travers, vers le canvas*/
        }

        #gold {
            color: #ffd84d;
        }

        #xp {
            color: #7df9ff;
        }
    </style>
    <script>

</script>
</head>
<body>
    <div id="hud">Or : <span id="gold">0</span><br>XP : <span id="xp">0</span></div>
    <canvas id="game"></canvas>
    <script>
        /////////////
        ////CANVAS///
        /////////////
        const canvas = document.getElementById("game"); /*the game canvas that we will draw on*/
        const ctx = canvas.getContext("2d"); /*le pinceau du jeu, il permet de "dessiner"/de faire les visuels du jeu*/
        const bgColor = "#000017";
        const OUTLINE_WIDTH = 1;        // contour fin des planètes et des ennemis, en pixels
        const OUTLINE_COLOR = "white";

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const center = { x: canvas.width / 2, y: canvas.height / 2 };


        function drawCanvas() {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGalaxy();
            drawStars();
            drawPlanets();
            drawEnemies();
            drawBullets();
            drawPlayer();

            if (isGameOver) {
                drawGameOver();
            }
        }


        //////////////////////
        ////BACKGROUND////////  Background stars and galaxy effect
        //////////////////////
        const stars = []; /*stars array*/
        const STAR_COORDINATES = { x: canvas.width, y: canvas.height }; /*Stars display boundaries, can also just put a flat number*/
        const STAR_MAX_SIZE = 4;
        const STAR_COUNT = 200; /*The amount of stars displayed*/

        const GALAXY_THICKNESS = 300;
        const galaxyTop = canvas.height / 2 - GALAXY_THICKNESS / 2;

        function createStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * STAR_COORDINATES.x,
                    y: Math.random() * STAR_COORDINATES.y,
                    size: Math.random() * STAR_MAX_SIZE
                });
            }

            drawStars();
        }

        function drawGalaxy() {
            const galaxyGradient = ctx.createLinearGradient(0, 0, canvas.height, canvas.width);
            galaxyGradient.addColorStop(0, "rgba(0, 0, 0, 0)")
            galaxyGradient.addColorStop(0.5, "rgba(85, 0, 255, 0.3)")
            galaxyGradient.addColorStop(1, "rgba(0, 0, 0, 0)")

            ctx.fillStyle = galaxyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height)
        }

        function drawStars() {
            for (const star of stars) {
                ctx.fillStyle = "white";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
        }


        ///////////////////////
        ////PLAYER & PLANETS///
        ///////////////////////
        //let planet = { name: "", orbitRadius = 100, speed = 5, color = "#00ff00"};
        const PLAYER_ROTATION_SPEED = 2;
        let playerRotation = 0;
        const ORBITING_PLANETS_COUNT = 5;
        let planetOrbitalRotation = 0;
        const PLANETS_ORBITAL_ROTATION_SPEED = .25;
        const planets = [];

        function drawStarShape(color = "#ffe680", branches = 10, innerRadius = 10, outerRadius = 25, rotationSpeed = .5, rotationalDirection = - 1) {
            //STAR
            ctx.beginPath();
            for (let i = 0; i < branches; i++) {
                const angle = (playerRotation * rotationSpeed * rotationalDirection) + (Math.PI * 2 / branches * i);

                if (i % 2 == 0) {
                    const x = center.x + Math.cos(angle) * innerRadius;
                    const y = center.y + Math.sin(angle) * innerRadius;
                    ctx.lineTo(x, y);
                } else {
                    const x = center.x + Math.cos(angle) * outerRadius;
                    const y = center.y + Math.sin(angle) * outerRadius;
                    ctx.lineTo(x, y);
                }
            }
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawCircle(color = "#ffe680", radius = 20, count = 50, rotationSpeed = .25, rotationalDirection = - 1, outline = false, outlineWidth = 0, outlineColor = "#ffffff", location = center) {
            //PARAMETERS
            const centerX = location.x;
            const centerY = location.y;

            if (outline) {
                drawCircle(outlineColor, outlineWidth, count, rotationSpeed, rotationalDirection, false, 0, outlineColor, location);
            }

            //CIRCLE
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const angle = (playerRotation * rotationSpeed * rotationalDirection - Math.PI / 2) + (Math.PI * 2 / count * i);

                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                ctx.lineTo(x, y);

            }
            ctx.fillStyle = color;
            ctx.fill();

        }

        //PLAYER HEALTH
        const PLAYER_RADIUS = 32;
        const PLAYER_MAX_HEALTH = 100;
        const PLAYER_HIT_FLASH_DURATION = 0.15;   // secondes
        let playerHealth = PLAYER_MAX_HEALTH;
        let playerHitTimer = 0;
        let isGameOver = false;

        function damagePlayer(amount) {
            playerHealth -= amount;
            playerHitTimer = PLAYER_HIT_FLASH_DURATION;

            if (playerHealth <= 0) {
                playerHealth = 0;
                isGameOver = true;
            }
        }

        function drawPlayer() {
            const color = playerHitTimer > 0 ? "white" : "#ffe680";
            //Pour un triangle, le contour doit être 2x plus grand pour avoir la même épaisseur sur les côtés que les cercles
            drawCircle(color, PLAYER_RADIUS, 4, .1, -1, true, PLAYER_RADIUS + OUTLINE_WIDTH * 2, OUTLINE_COLOR); //Centered shape is the player
            drawPlayerHealth();
        }

        //HEALTH NUMBER (au centre du joueur)
        function drawPlayerHealth() {
            ctx.font = "bold 20px Rubik";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle"; //le y du texte = le milieu des lettres, pas le bas
            ctx.lineWidth = 3;
            ctx.strokeStyle = OUTLINE_COLOR;
            ctx.strokeText(playerHealth, center.x, center.y); //contour noir du texte, pour qu'il reste lisible
            ctx.fillStyle = "brown";
            ctx.fillText(playerHealth, center.x, center.y);
            ctx.textBaseline = "alphabetic"; //on remet la valeur par défaut pour les autres textes
        }

        //REWARDS (or et XP)
        let gold = 0;
        let xp = 0;
        const goldDisplay = document.getElementById("gold");
        const xpDisplay = document.getElementById("xp");

        function gainRewards(goldAmount, xpAmount) {
            gold += goldAmount;
            xp += xpAmount;
            goldDisplay.textContent = gold;
            xpDisplay.textContent = xp;
        }

        //GAME OVER
        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "60px Rubik";
            ctx.fillText("GAME OVER", center.x, center.y - 180);
            ctx.font = "24px Rubik";
            ctx.fillText("Appuie sur R pour recommencer", center.x, center.y - 140);
        }

        function restartGame() {
            playerHealth = PLAYER_MAX_HEALTH;
            enemies.length = 0;
            bullets.length = 0;
            enemySpawnTimer = 0;
            fireTimer = 0;
            isGameOver = false;
        }

        document.addEventListener("keydown", function (event) {
            if (event.key === "r" && isGameOver) {
                restartGame();
            }
        });

        // RÉGLAGES DES PLANÈTES
        const PLANET_COLORS = ["#7df9ff", "#ff7eb6", "#9dff7a", "#ffb86b", "#c3a6ff"];
        const PLANET_ORBIT_RADIUS = 100;
        const PLANET_SIZE = 20;

        // CRÉATION (une seule fois, au démarrage)
        function createPlanets() {
            for (let i = 0; i < ORBITING_PLANETS_COUNT; i++) {
                planets.push({
                    //Mettre ici toutes les infos qui seront nécessaires pour les planètes, (skillTree, projets, liens...)
                    name: "Projet " + (i + 1),
                    color: PLANET_COLORS[i],
                    size: PLANET_SIZE,
                    x: 0,
                    y: 0
                });
            }
        }


        function drawPlanets() {
            for (let i = 0; i < planets.length; i++) {
                const planet = planets[i];
                const angle = planetOrbitalRotation + Math.PI * 2 / planets.length * i;

                planet.x = center.x + Math.cos(angle) * PLANET_ORBIT_RADIUS;
                planet.y = center.y + Math.sin(angle) * PLANET_ORBIT_RADIUS;

                drawCircle(planet.color, planet.size, 4, 0, 0, true, planet.size + OUTLINE_WIDTH, OUTLINE_COLOR, { x: planet.x, y: planet.y });
            }
        }

        /////////////
        ///ENEMIES///
        /////////////
        const enemies = [];
        const ENEMY_SPAWN_INTERVAL = 1;      // un ennemi toutes les X secondes
        let enemySpawnTimer = 0;

        //TYPES (éléments)
        const ENEMY_TYPES = {
            water: { color: "#4da6ff", speed: 50, minSize: 9, maxSize: 15, damage: 10, health: 3, gold: 2, xp: 3 },
            fire: { color: "#ff5533", speed: 90, minSize: 6, maxSize: 11, damage: 20, health: 2, gold: 3, xp: 4 },
            plant: { color: "#55dd55", speed: 35, minSize: 11, maxSize: 20, damage: 15, health: 5, gold: 4, xp: 6 },
            air: { color: "#e0f7ff", speed: 70, minSize: 5, maxSize: 9, damage: 5, health: 1, gold: 1, xp: 2 }
        };

        //MOVEMENTS
        const MOVEMENT_TYPES = ["straight", "wave", "zigzag", "spiral"];
        const ENEMY_WAVE_AMPLITUDE = 40;     // écart max sur le côté, en pixels
        const ENEMY_WAVE_FREQUENCY = 3;      // vitesse des oscillations
        const ENEMY_SPIRAL_SPEED = 0.4;      // vitesse de rotation autour du joueur

        function pickRandom(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function randomBetween(min, max) {
            return min + Math.random() * (max - min);
        }

        function spawnEnemy() {
            const type = pickRandom(Object.keys(ENEMY_TYPES));
            const stats = ENEMY_TYPES[type];
            const size = randomBetween(stats.minSize, stats.maxSize);
            const startDistance = Math.hypot(canvas.width, canvas.height) / 2 + size + ENEMY_WAVE_AMPLITUDE;

            enemies.push({
                type: type,
                movement: pickRandom(MOVEMENT_TYPES),
                color: stats.color,
                speed: stats.speed,
                size: size,
                damage: stats.damage,
                health: stats.health,
                gold: stats.gold,
                xp: stats.xp,
                angle: Math.random() * Math.PI * 2,
                distance: startDistance,
                startDistance: startDistance,
                time: 0,
                x: 0,
                y: 0
            });
        }

        function updateEnemies(deltaTime) {
            //SPAWN
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer >= ENEMY_SPAWN_INTERVAL) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            //MOVE
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];

                enemy.time += deltaTime;
                enemy.distance -= enemy.speed * deltaTime;

                if (enemy.distance <= PLAYER_RADIUS + enemy.size) {
                    damagePlayer(enemy.damage);
                    enemies.splice(i, 1);
                    continue;
                }

                let sideOffset = 0;

                if (enemy.movement === "wave") {
                    sideOffset = Math.sin(enemy.time * ENEMY_WAVE_FREQUENCY) * ENEMY_WAVE_AMPLITUDE;
                } else if (enemy.movement === "zigzag") {
                    sideOffset = Math.asin(Math.sin(enemy.time * ENEMY_WAVE_FREQUENCY)) / (Math.PI / 2) * ENEMY_WAVE_AMPLITUDE;
                } else if (enemy.movement === "spiral") {
                    enemy.angle += ENEMY_SPIRAL_SPEED * deltaTime;
                }

                sideOffset *= enemy.distance / enemy.startDistance;

                const dirX = Math.cos(enemy.angle);
                const dirY = Math.sin(enemy.angle);

                enemy.x = center.x + dirX * enemy.distance - dirY * sideOffset;
                enemy.y = center.y + dirY * enemy.distance + dirX * sideOffset;
            }
        }

        function drawEnemies() {
            for (const enemy of enemies) {
                drawCircle(enemy.color, enemy.size, 30, 0, 0, true, enemy.size + OUTLINE_WIDTH, OUTLINE_COLOR, { x: enemy.x, y: enemy.y });
            }
        }

        /////////////
        ///BULLETS///
        /////////////
        const bullets = [];
        const PLAYER_FIRE_INTERVAL = 0.35;   // un tir toutes les X secondes
        const PLAYER_RANGE = 300;            // distance max pour viser un ennemi, en pixels
        const BULLET_SPEED = 400;            // pixels par seconde
        const BULLET_SIZE = 4;
        const BULLET_DAMAGE = 1;
        const BULLET_COLOR = "#fff6b0";
        let fireTimer = 0;

        function findClosestEnemy() {
            let closestEnemy = null;
            let closestDistance = PLAYER_RANGE;

            for (const enemy of enemies) {
                const distance = Math.hypot(enemy.x - center.x, enemy.y - center.y);
                if (distance < closestDistance) {
                    closestEnemy = enemy;
                    closestDistance = distance;
                }
            }
            return closestEnemy;
        }

        function shootAt(target) {
            bullets.push({
                x: center.x,
                y: center.y,
                dirX: 0,
                dirY: 0,
                target: target
            });
        }

        function hitEnemy(enemy, index) {
            enemy.health -= BULLET_DAMAGE;

            if (enemy.health <= 0) {
                enemies.splice(index, 1);
                gainRewards(enemy.gold, enemy.xp);
            }
        }

        function updateBullets(deltaTime) {
            //FIRE
            fireTimer += deltaTime;
            if (fireTimer >= PLAYER_FIRE_INTERVAL) {
                const target = findClosestEnemy();
                if (target !== null) {
                    shootAt(target);
                    fireTimer = 0;
                }
            }

            //MOVE & HIT
            const maxDistance = Math.hypot(canvas.width, canvas.height) / 2;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];

                //La balle suit sa cible tant qu'elle est vivante, sinon elle continue tout droit
                if (enemies.includes(bullet.target)) {
                    const dx = bullet.target.x - bullet.x;
                    const dy = bullet.target.y - bullet.y;
                    const distance = Math.hypot(dx, dy);
                    bullet.dirX = dx / distance;
                    bullet.dirY = dy / distance;
                }

                bullet.x += bullet.dirX * BULLET_SPEED * deltaTime;
                bullet.y += bullet.dirY * BULLET_SPEED * deltaTime;

                let hasHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y) <= enemy.size + BULLET_SIZE) {
                        hitEnemy(enemy, j);
                        hasHit = true;
                        break;
                    }
                }

                const isOffScreen = Math.hypot(bullet.x - center.x, bullet.y - center.y) > maxDistance;

                if (hasHit || isOffScreen) {
                    bullets.splice(i, 1);
                }
            }
        }

        function drawBullets() {
            for (const bullet of bullets) {
                drawCircle(BULLET_COLOR, BULLET_SIZE, 12, 0, 0, true, BULLET_SIZE + OUTLINE_WIDTH, OUTLINE_COLOR, { x: bullet.x, y: bullet.y });
            }
        }

        

        /////////////////////
        ////START & UPDATE///
        /////////////////////
        let lastTime = performance.now();


        function gameStart() {
            createStars();
            createPlanets();
            requestAnimationFrame(gameUpdate);
        }

        function gameUpdate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000; //DeltaTime en secondes
            lastTime = currentTime;

            playerRotation += PLAYER_ROTATION_SPEED * deltaTime;
            planetOrbitalRotation += PLANETS_ORBITAL_ROTATION_SPEED * deltaTime;

            if (!isGameOver) {
                updateEnemies(deltaTime);
                updateBullets(deltaTime);
            }
            playerHitTimer -= deltaTime;
            drawCanvas();
            requestAnimationFrame(gameUpdate);
        }

        gameStart();
    </script>
</body>
</html>
