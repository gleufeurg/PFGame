<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Evangeline's Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <style>
        body { /*pré-réglages du body, là où se trouve le canvas du jeu*/
            margin: 0; /* pas de marge automatique*/
            overflow: hidden; /*enlève les barres de défilement*/
            background-color: #2e2e2e;
            color: white;
            outline: 1px, solid gold;
            font-family: "Rubik", sans-serif; /*"Rubik" possible car certains noms contiennent des espaces, ici pas nécessaire mais juste au cas ou*/
            text-align: center;
            font-size: 30px;
        }

        #game {
            /*outline: 1px solid antiquewhite;
            outline-offset: -1px;*/
        }
    </style>
    <script>

</script>
</head>
<body>
    <canvas id="game"></canvas>
    <script>
        /////////////////////
        ////MISCS SETTINGS///  All the variables you can manually change to modify the game
        /////////////////////
        

        /////////////
        ////CANVAS///
        /////////////
        const canvas = document.getElementById("game"); /*the game canvas that we will draw on*/
        const ctx = canvas.getContext("2d"); /*le pinceau du jeu, il permet de "dessiner"/de faire les visuels du jeu*/
        const bgColor = "#2e2e2e";

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        /////////////
        ////STARS////  Background stars
        /////////////
        const star = { x: canvas.width, y: canvas.height }; /*Background's stars infos, x and y are displaye boundaries*/
        const stars = []; /*stars array*/
        const STAR_MAX_SIZE = 4;
        const STAR_COUNT = 200; /*The amount of quantity displayed*/

        function createStars() {
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * star.x,
                    y: Math.random() * star.y,
                    size: Math.random() * STAR_MAX_SIZE
                });
            }

            drawStars();
        }

        function drawStars() {
            for (const star of stars) {
                ctx.fillStyle = "white";
                ctx.fillRect(star.x, star.y, star.size, star.size);
                console.log(stars.size);
            }
        }


        /////////////////////
        ////START & UPDATE///
        /////////////////////
        gameStart();
        gameUpdate();

        function gameStart() {
            createStars();
        }

        function gameUpdate() {

        }
        
    </script>
</body>
</html>
