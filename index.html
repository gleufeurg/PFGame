<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Eva's game</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: white;
            font-family: Rubik;
            text-align: center;
            font-size: 30px;
        }

        #score {
            color: aquamarine;
        }
        
        #life {
            color: brown;
        }

        #endScreen {
            color: darkred;
            font-family: Rubik;
            font-weight: bold;
            font-size: 100px;
        }

        .stat {
            font-size: 20px;
            text-align: left;
            padding: 10px;
            color: slategrey;
            border: double;
        }
    </style>
</head>
<body>
    <h1>Mon piti jeu</h1>
    <span id="endScreen"></span>
    <span class = "stat"> Score : <span id="score"></span></span>
    <span class ="stat"> Life : <span id="life"></span></span>
    <script>
        //LIFE
        let life = 5;
        const lifeDisplay = document.getElementById("life");
        lifeDisplay.textContent = life;

        //SCORE
        let score = 0;
        const scoreDisplay = document.getElementById("score");
        scoreDisplay.textContent = score;

        //MISC
        let damage = 3;
        let hasGameEnded = false;
        const endScreenDisplay = document.getElementById("endScreen");

        document.addEventListener("keydown", function (event) {
            if (event.key === "r") {
                //Restart game
                restart();
            }

            //Check game status
            if (hasGameEnded)
                return;

            if (event.key === " ") {
                //Update Score
                updateScore(1);
            }

            if (event.key === "d") {
                //TakeDamage
                takeDamage(1);
            }
        })

        function restart() {
            updateScore(-score);
            life = 5;
            lifeDisplay.textContent = life;
            endScreenDisplay.textContent = "";
            hasGameEnded = false;
        }

        function updateScore(n) {
            score += n;
            scoreDisplay.textContent = score;
        }

        function takeDamage(n) {
            life -= n;
            lifeDisplay.textContent = life;

            if (life <= 0) {
                endScreenDisplay.textContent = "GAME OVER";
                hasGameEnded = true;
            }
        }
    </script>
</body>
</html>
